name: Bug report
description: Installation, editing or Cookidoo upload problem
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Issues and attachments are public. Never include passwords, cookies, session tokens, email, private launch URLs, databases or raw logs. Remove personal information from recipe JSON, errors and screenshots before posting.'
  - type: input
    id: version
    attributes:
      label: Recipe Studio version and Windows version/build
      placeholder: 'Example: 1.0.5; Windows 11 24H2'
    validations:
      required: true
  - type: input
    id: market
    attributes:
      label: Cookidoo market
      description: 'Country/domain selected in Settings. For installation or offline editing problems, enter Not applicable.'
      placeholder: 'Example: Czech Republic / cookidoo.cz'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do, and where did it fail?
      description: 'Give short reproduction steps, expected/actual result and the recipe step number if relevant. For connection/upload problems, say whether Created Recipes works in Cookidoo’s own editor. Include TM7 firmware only for device problems.'
      placeholder: 'Example: Imported JSON, clicked Upload, then step 3 was rejected.'
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error text
      description: 'Copy the displayed error after removing personal details. Enter No error shown if there was none.'
    validations:
      required: true
  - type: textarea
    id: recipe
    attributes:
      label: Recipe JSON (optional)
      description: 'Paste or attach a minimal recipe JSON that reproduces the problem. Remove personal/private content, source links and identifying metadata; use synthetic replacements where possible. Do not attach database exports.'
      render: json
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostic report (optional)
      description: 'Settings → Help and diagnostics → Generate diagnostic report. Inspect before copying; no private logs or database exports.'
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this public report and its attachments and removed credentials, cookies, session tokens, email, private recipe details and identifying paths.
          required: true
